
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🌡️ Temperature Converter</h1>
        <p class="subtitle">Convert temperatures with ease!</p>

        <div class="converter">
            <label for="temperature">Enter Temperature</label>
            <input
                type="number"
                id="temperature"
                placeholder="Enter a value"
                step="any"
            >

            <label for="unit">Convert From</label>
            <select id="unit">
                <option value="celsius">Celsius (°C)</option>
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>

            <button id="convertBtn" type="button">Convert Temperature</button>

            <p id="error" role="alert"></p>

            <div id="result" aria-live="polite">
                <h2>Results</h2>
                <p>Celsius: <span id="celsius">--</span></p>
                <p>Fahrenheit: <span id="fahrenheit">--</span></p>
                <p>Kelvin: <span id="kelvin">--</span></p>
            </div>
        </div>

        <footer>
            <p>Designed by Madhumitha Kumaresan</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
